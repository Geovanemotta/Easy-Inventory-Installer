# ==========================================================
# INVENTÁRIO CORPORATIVO - CONFIGURAÇÃO NGINX REVERSE PROXY
# Porta 80 (HTTP -> HTTPS) e Porta 443 (HTTPS Seguro)
# ==========================================================

# Oculta versao do Nginx nos cabecalhos de resposta (Mitigacao de Vulnerabilidades/Reconhecimento)
server_tokens off;

# Rate Limiting por IP para rotas de autenticacao (mitigacao de forca bruta / brute-force)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_status 429;

# Mapeamento dinâmico para suporte adequado a WebSockets e HTTP regular
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ----------------------------------------------------------
# SERVIDOR HTTP (PORTA 80) - REDIRECIONAMENTO OBRIGATÓRIO PARA HTTPS
# ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Desafio ACME caso seja utilizado Let's Encrypt no futuro
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redireciona todo o trafego HTTP para HTTPS (Porta 443)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------
# SERVIDOR HTTPS (PORTA 443) - SISTEMA DE INVENTÁRIO
# ----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Certificados SSL (Corporativo ou Fallback gerado automaticamente)
    ssl_certificate     /etc/nginx/certs/giassi.crt;
    ssl_certificate_key /etc/nginx/certs/giassi.key;

    # Protocolos seguros (Desativa TLS 1.0, TLS 1.1 e SSL antigos e vulneraveis)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Otimizacao de Sessoes SSL/TLS
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabecalhos de Seguranca (Protecao contra Clickjacking, MIME sniffing, XSS, etc.)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-src 'self' https://$host:4443 https://*:4443 https://inventario.giassi.com.br:4443 blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

    # Limite maximo de payload para upload de inventarios pesados (50MB)
    client_max_body_size 50M;

    # Compressao Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ------------------------------------------------------
    # 1. FRONTEND WEB (SINGLE PAGE APPLICATION - REACT)
    # ------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Cache de arquivos estaticos estaveis
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Roteamento SPA: Qualquer rota nao-arquivo entrega o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------
    # 2. BACKEND API (FASTAPI / UVICORN REVERSE PROXY)
    # ------------------------------------------------------
    # Terminal Web (SSH / WebSockets com timeout estendido de 1 hora)
    location /api/v1/terminal/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Protecao contra forca bruta na rota de login
    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Suporte a WebSockets e SSE se necessario
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Repasse de IP real e protocolos para auditoria e geracao dinamica de scripts
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Garante que redirecionamentos do backend permaneçam em HTTPS
        proxy_redirect http:// $scheme://;

        # Timeouts generosos para relatorios ou cargas pesadas
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # ------------------------------------------------------
    # 3. DOCUMENTAÇÃO FASTAPI (SWAGGER / OPENAPI)
    # Bloqueado em produção para evitar reconhecimento de rotas e schemas
    # ------------------------------------------------------
    location ~ ^/(docs|redoc|openapi.json) {
        return 404;
    }
}

# ----------------------------------------------------------
# SERVIDOR HTTPS (PORTA 4443) - MESHCENTRAL ACESSO REMOTO
# ----------------------------------------------------------
server {
    listen 4443 ssl;
    listen [::]:4443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/giassi.crt;
    ssl_certificate_key /etc/nginx/certs/giassi.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL_MESH:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Permite incorporação nos iframes a partir do próprio domínio e portas
    add_header Content-Security-Policy "frame-ancestors 'self' https://$host https://$host:443 https://$http_host https://inventario.giassi.com.br;" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Payload para transferência de arquivos via web
    client_max_body_size 500M;

    location / {
        proxy_pass https://meshcentral:4430;
        proxy_ssl_verify off;
        proxy_http_version 1.1;

        # Oculta qualquer X-Frame-Options legado do upstream para permitir iframe
        proxy_hide_header X-Frame-Options;

        # WebSockets (essenciais para transmissão de tela e mouse em tempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longos para manter sessões interativas ativas
        proxy_connect_timeout 90s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
