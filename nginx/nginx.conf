# ==========================================================
# INVENTÁRIO CORPORATIVO - CONFIGURAÇÃO NGINX REVERSE PROXY
# Porta 80 (HTTP -> HTTPS) e Porta 443 (HTTPS Seguro)
# ==========================================================

# Oculta versao do Nginx nos cabecalhos de resposta (Mitigacao de Vulnerabilidades/Reconhecimento)
server_tokens off;

# ----------------------------------------------------------
# SERVIDOR HTTP (PORTA 80) - REDIRECIONAMENTO OBRIGATÓRIO PARA HTTPS
# ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Desafio ACME caso seja utilizado Let's Encrypt no futuro
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redireciona todo o trafego HTTP para HTTPS (Porta 443)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------
# SERVIDOR HTTPS (PORTA 443) - SISTEMA DE INVENTÁRIO
# ----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Certificados SSL (Corporativo ou Fallback gerado automaticamente)
    ssl_certificate     /etc/nginx/certs/giassi.crt;
    ssl_certificate_key /etc/nginx/certs/giassi.key;

    # Protocolos seguros (Desativa TLS 1.0, TLS 1.1 e SSL antigos e vulneraveis)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Otimizacao de Sessoes SSL/TLS
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabecalhos de Seguranca (Protecao contra Clickjacking, MIME sniffing, etc.)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Limite maximo de payload para upload de inventarios pesados (50MB)
    client_max_body_size 50M;

    # Compressao Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ------------------------------------------------------
    # 1. FRONTEND WEB (SINGLE PAGE APPLICATION - REACT)
    # ------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Cache de arquivos estaticos estaveis
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Roteamento SPA: Qualquer rota nao-arquivo entrega o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------
    # 2. BACKEND API (FASTAPI / UVICORN REVERSE PROXY)
    # ------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Suporte a WebSockets e SSE se necessario
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Repasse de IP real e protocolos para auditoria e geracao dinamica de scripts
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Garante que redirecionamentos do backend permaneçam em HTTPS
        proxy_redirect http:// $scheme://;

        # Timeouts generosos para relatorios ou cargas pesadas
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # ------------------------------------------------------
    # 3. DOCUMENTAÇÃO FASTAPI (SWAGGER / OPENAPI)
    # ------------------------------------------------------
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
