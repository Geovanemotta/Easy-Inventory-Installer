services:

  postgres:
    image: postgres:18
    container_name: zenithmap-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    networks:
      - zenithmap_db_net

    volumes:
      - zenithmap_pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: zenithmap-backend
    restart: unless-stopped

    networks:
      - zenithmap_db_net
      - zenithmap_web_net

    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "${JWT_ACCESS_TOKEN_EXPIRE_MINUTES}"
      PYTHONPATH: "/app"
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      ENABLE_SWAGGER_DOCS: "${ENABLE_SWAGGER_DOCS:-false}"
      PORT_HTTPS: "${PORT_HTTPS:-443}"
      PORT_HTTP: "${PORT_HTTP:-80}"
      SERVER_HOST: "${SERVER_HOST:-localhost}"

    ports:
      - "0.0.0.0:8000:8000"

    volumes:
      - ./backend:/app
      - ./scripts_agents:/app/scripts_agents:ro
      - ./meshcentral:/app/meshcentral
      - meshcentral_data:/opt/meshcentral-data:rw

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --reload

    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .pytest_cache/
        - action: rebuild
          path: ./backend/requirements.txt

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: zenithmap-frontend
    restart: unless-stopped
    networks:
      - zenithmap_web_net
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package.json

  nginx:
    build:
      context: ./nginx
    container_name: zenithmap-nginx
    restart: unless-stopped
    networks:
      - zenithmap_web_net
    environment:
      SERVER_HOST: "${SERVER_HOST:-localhost}"
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
      - "${PORT_MESHCENTRAL:-4443}:4443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
      - meshcentral
    develop:
      watch:
        - action: sync+restart
          path: ./nginx/nginx.conf
          target: /etc/nginx/conf.d/default.conf

  meshcentral:
    build:
      context: ./meshcentral
    container_name: zenithmap-meshcentral
    restart: unless-stopped
    networks:
      - zenithmap_web_net
    environment:
      - NODE_ENV=production
    volumes:
      - ./meshcentral/config.json:/opt/meshcentral/meshcentral-data/config.json:ro
      - ./meshcentral/custom.css:/opt/meshcentral/meshcentral/public/styles/custom.css:ro
      - ./meshcentral/ensure_permissions.js:/opt/meshcentral/ensure_permissions.js:ro
      - ./meshcentral/reset_2fa.js:/opt/meshcentral/reset_2fa.js:ro
      - ./nginx/certs/server.crt:/opt/meshcentral/meshcentral-data/server.crt:ro
      - meshcentral_data:/opt/meshcentral/meshcentral-data
      - meshcentral_files:/opt/meshcentral/meshcentral-files
    expose:
      - "4430"

volumes:
  zenithmap_pgdata:
  meshcentral_data:
  meshcentral_files:

networks:
  zenithmap_db_net:
    driver: bridge
  zenithmap_web_net:
    driver: bridge
